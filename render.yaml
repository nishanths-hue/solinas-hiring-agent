services:
  - type: web
    name: solinas-hiring-agent
    env: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in Render dashboard — do not commit this
      - key: DATABASE_URL
        fromDatabase:
          name: solinas-hiring-db
          property: connectionString

databases:
  - name: solinas-hiring-db
    plan: starter
    databaseName: hiring
    user: hiring_app
